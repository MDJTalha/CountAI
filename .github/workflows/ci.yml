name: CountAI CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: countai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Regression tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Run required regression suites
        shell: bash
        run: |
          set -euo pipefail
          for script in test:ci-coverage test:counting-benchmark test:cctv-first-frontend test:engine test:analytics test:overlay-labels test:operational-events test:operational-event-store test:operational-events-sqlite test:operational-events-api test:spais-resources-api test:connector-telemetry-api test:connector-agent test:recording-assurance test:incidents-api test:spais-sops-api test:learning-candidates-api test:learning-sources test:learning-sources-api test:learning-evaluations-api test:live-sessions test:spais-contracts test:spais-auth test:spais-auth-oidc test:detection-enhancement test:camera-health test:camera-health-history test:security-controls test:security-controls-api test:pwa-build test:server test:sqlite-backup test:sqlite-restore-drill test:production-config; do
            if ! node -e "process.exit(require('./package.json').scripts?.['${script}'] ? 0 : 1)"; then
              echo "::error::Required test script is missing: ${script}"
              exit 1
            fi
            echo "::group::npm run ${script}"
            npm run "${script}"
            echo "::endgroup::"
          done

      - name: Verify PWA service worker was generated
        run: test -f dist/sw.js
