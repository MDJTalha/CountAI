name: CountAI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: countai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Regression tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Run required regression suites
        shell: bash
        run: |
          set -euo pipefail
          for script in test:ci-coverage test:counting-benchmark test:cctv-first-frontend test:engine test:analytics test:overlay-labels test:operational-events test:operational-event-store test:operational-events-sqlite test:operational-events-api test:spais-resources-api test:connector-telemetry-api test:connector-agent test:recording-assurance test:incidents-api test:spais-sops-api test:learning-candidates-api test:learning-sources test:learning-sources-api test:learning-evaluations-api test:live-sessions test:spais-contracts test:spais-auth test:spais-auth-oidc test:detection-enhancement test:camera-health test:camera-health-history test:security-controls test:security-controls-api test:pwa-build test:server test:sqlite-backup test:sqlite-restore-drill test:production-config test:ops-deployment; do
            if ! node -e "process.exit(require('./package.json').scripts?.['${script}'] ? 0 : 1)"; then
              echo "::error::Required test script is missing: ${script}"
              exit 1
            fi
            echo "::group::npm run ${script}"
            npm run "${script}"
            echo "::endgroup::"
          done

      - name: Verify PWA service worker was generated
        run: test -f dist/sw.js

      - name: Validate local and registry Compose configurations
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet
          COUNTAI_IMAGE=ghcr.io/mdjtalha/countai:v1.2.3 COUNTAI_PULL_POLICY=always docker compose config --quiet

      - name: Build production container
        run: docker build --pull -t countai:ci .

      - name: Smoke-test production container
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f countai-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name countai-ci -p 127.0.0.1:18787:8787 \
            -e NODE_ENV=production \
            -e PORT=8787 \
            -e SPAIS_EVENTS_DB_PATH=/tmp/countai/events.sqlite \
            -e COUNTAI_BACKUP_DIR=/tmp/countai/backups \
            -e SPAIS_AUTH_ISSUER=https://identity.example.test/ \
            -e SPAIS_AUTH_AUDIENCE=countai-api \
            -e SPAIS_AUTH_JWKS_URL=https://identity.example.test/.well-known/jwks.json \
            -e COUNTAI_LEARNING_SOURCE_RETENTION_DAYS=90 \
            countai:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18787/api/health >/tmp/countai-health.json; then
              break
            fi
            sleep 2
          done
          node -e "const h=require('/tmp/countai-health.json'); if(h.ok!==true || h.service!=='countai-api') process.exit(1)"
          curl --fail --silent http://127.0.0.1:18787/api/v1/spais/contracts >/dev/null
          docker inspect --format='{{.State.Running}}' countai-ci | grep -qx true
